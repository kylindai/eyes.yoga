<!DOCTYPE html>
<html>

<head>
    <title>SSE Greeter</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='comm/img/icon-32x32.png') }}" type="image/x-icon" />
</head>

<body>
    <div id="message">sse_host = {{ sse_host }}</div>
    <script type="text/javascript">
        const chat_event = new EventSource('//{{ sse_host }}/stream/chat');
        let count = 0;
        chat_event.addEventListener('greeting', (event) => {
            const event_data = JSON.parse(event.data);
            console.log(event_data);
            if (event_data.ts > 10) {
                chat_event.close();
            }
        });
    </script>
</body>

</html>
